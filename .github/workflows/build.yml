name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build and Archive
      run: |
        xcodebuild -project ThreeOneOSFive.xcodeproj \
                   -scheme ThreeOneOSFive \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $PWD/build/ThreeOneOSFive.xcarchive \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Package to IPA
      run: |
        mkdir -p Payload
        cp -r build/ThreeOneOSFive.xcarchive/Products/Applications/*.app Payload/
        zip -r ThreeOneOSFive.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThreeOneOSFive-ipa
        path: ThreeOneOSFive.ipa
