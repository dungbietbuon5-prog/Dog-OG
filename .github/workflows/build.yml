name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Đang giải nén $f..."
            unzip -q "$f"
          fi
        done

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Find Project and Build
      run: |
        # Tìm file .xcodeproj hoặc .xcworkspace ở mọi thư mục con
        PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
        WORKSPACE_PATH=$(find . -name "*.xcworkspace" -maxdepth 3 | head -n 1)
        
        if [ -n "$WORKSPACE_PATH" ]; then
            BUILD_TARGET="-workspace $WORKSPACE_PATH"
            TARGET_DIR=$(dirname "$WORKSPACE_PATH")
        elif [ -n "$PROJECT_PATH" ]; then
            BUILD_TARGET="-project $PROJECT_PATH"
            TARGET_DIR=$(dirname "$PROJECT_PATH")
        else
            echo "LỖI: Không tìm thấy file .xcodeproj hoặc .xcworkspace nào trong file zip!"
            exit 1
        fi
        
        echo "Đã tìm thấy dự án tại: $TARGET_DIR"
        echo "Đang build với: $BUILD_TARGET"
        
        # Di chuyển vào đúng thư mục chứa dự án
        cd "$TARGET_DIR"
        
        xcodebuild $BUILD_TARGET \
                   -scheme ThreeOneOSFive \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $PWD/../../build/ThreeOneOSFive.xcarchive \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Package to IPA
      run: |
        mkdir -p Payload
        cp -r build/ThreeOneOSFive.xcarchive/Products/Applications/*.app Payload/
        zip -r ThreeOneOSFive.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThreeOneOSFive-ipa
        path: ThreeOneOSFive.ipa
