name: Extract IPA Info

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract_info:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract IPA and Read Info.plist
      run: |
        # Tìm file .ipa đầu tiên trong thư mục
        IPA_FILE=$(ls *.ipa | head -n 1)
        
        if [ -z "$IPA_FILE" ]; then
          echo "LỖI: Không tìm thấy file .ipa nào trong repo!"
          exit 1
        fi
        
        echo "Đang xử lý file: $IPA_FILE"
        
        # Giải nén IPA
        unzip -q "$IPA_FILE" -d extracted_ipa
        
        # Tìm thư mục .app bên trong Payload
        APP_DIR=$(find extracted_ipa/Payload -name "*.app" | head -n 1)
        
        if [ -z "$APP_DIR" ]; then
          echo "LỖI: Không tìm thấy thư mục .app bên trong Payload!"
          exit 1
        fi
        
        echo "--- THÔNG TIN APP ---"
        # Đọc thông tin từ Info.plist
        plutil -p "$APP_DIR/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"
        
        echo "--- KIẾN TRÚC BINARY ---"
        # Đọc kiến trúc file binary
        BINARY_NAME=$(basename "$APP_DIR" .app)
        lipo -info "$APP_DIR/$BINARY_NAME" || echo "Không đọc được kiến trúc (File có thể bị mã hóa)"

    - name: Upload Extracted Info
      uses: actions/upload-artifact@v4
      with:
        name: App-Info
        path: extracted_ipa/Payload/*.app/Info.plist
