name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -q "$f"
          fi
        done

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Find Project and Build
      run: |
        # TÌM FILE .xcodeproj NHƯNG BỎ QUA THƯ MỤC RÁC __MACOSX
        PROJECT_PATH=$(find $PWD -name "*.xcodeproj" -not -path "*/__MACOSX/*" -maxdepth 4 | head -n 1)
        WORKSPACE_PATH=$(find $PWD -name "*.xcworkspace" -not -path "*/__MACOSX/*" -maxdepth 4 | head -n 1)
        
        if [ -n "$WORKSPACE_PATH" ]; then
            BUILD_TARGET="-workspace $WORKSPACE_PATH"
        elif [ -n "$PROJECT_PATH" ]; then
            BUILD_TARGET="-project $PROJECT_PATH"
        else
            echo "LỖI: Không tìm thấy file dự án (đã bỏ qua __MACOSX)!"
            exit 1
        fi
        
        SCHEME_NAME=$(xcodebuild $BUILD_TARGET -list | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -n 1 | xargs)
        
        echo "Đã tìm thấy Dự án: $BUILD_TARGET"
        echo "Đã tìm thấy Scheme: $SCHEME_NAME"
        
        xcodebuild $BUILD_TARGET \
                   -scheme "$SCHEME_NAME" \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath $PWD/build/App.xcarchive \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Package to IPA
      run: |
        mkdir -p Payload
        cp -r build/App.xcarchive/Products/Applications/*.app Payload/
        zip -r App.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-ipa
        path: App.ipa
